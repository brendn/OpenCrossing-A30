name: Release

# Frugal with Actions minutes: runs only on version tags or when started
# by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    # armhf build runs under QEMU user emulation — expect it to be slow.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      # CMake + SDL2 are built from source under QEMU on first run; keep them
      # between runs. Bump the key if the versions in build-a30-docker.sh change.
      - name: Cache A30 build tools
        uses: actions/cache@v4
        with:
          path: pc/build-a30-tools
          key: a30-tools-cmake3.16.9-sdl2.26.5-v1

      - name: Build A30 binary (Ubuntu 16.04 / glibc 2.23, linux/arm/v7)
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD":/work \
            ubuntu:16.04 bash /work/pc/build-a30-docker.sh
          test -f pc/build-a30/bin/AnimalCrossing
          file pc/build-a30/bin/AnimalCrossing | grep -q 'ELF 32-bit.*ARM'

      - name: Package A30 zip
        run: |
          ZIP="AnimalCrossing-ac-gc-a30-${GITHUB_REF_NAME}.zip"
          ./a30/make-package.sh pc/build-a30/bin/AnimalCrossing "$PWD/$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload artifact (manual runs without a tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}

      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --generate-notes
